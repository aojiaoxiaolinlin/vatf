[package]
name = "vatf"
version = "0.1.0"
edition = "2024"
authors = ["aojiaoxiaolinlin"]
description = "Compile SWF animations and vector animations into baked VAB assets"
repository = "https://github.com/aojiaoxiaolinlin/vatf"
readme = "README.md"
keywords = ["swf", "flash", "animation", "vector", "converter"]
categories = ["graphics", "multimedia"]
license = "Apache-2.0"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-APACHE"]

[dependencies]
anyhow = "1.0.102"
bincode = "1"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
flate2 = "1.1.9"
gif = "0.14.2"
image = "0.25.10"
indexmap = "2.14.0"
jpeg-decoder = "0.3.2"
lyon_tessellation = "1.0.20"
png = "0.18.1"
swf = "0.2.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wide = "1.4.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_read"
harness = false
