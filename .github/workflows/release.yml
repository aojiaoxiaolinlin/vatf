name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - name: Select Rust stable
        run: rustup default stable
      - name: Test
        run: cargo test --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: vatf.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: vatf
          - os: macos-14
            target: aarch64-apple-darwin
            binary: vatf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Rust stable
        run: rustup default stable
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release --bin vatf --target ${{ matrix.target }}
      - name: Check executable
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version
      - name: Package executable
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "vatf-$env:RELEASE_TARGET"
          $packageDirectory = Join-Path 'dist' $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item -LiteralPath "target/$env:RELEASE_TARGET/release/$env:RELEASE_BINARY" -Destination $packageDirectory
          Copy-Item -LiteralPath 'README.md', 'LICENSE-APACHE' -Destination $packageDirectory
          if ($IsWindows) {
            Compress-Archive -Path $packageDirectory -DestinationPath "dist/$packageName.zip"
          } else {
            tar -czf "dist/$packageName.tar.gz" -C dist $packageName
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vatf-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: vatf-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum vatf-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
